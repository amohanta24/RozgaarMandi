<h2 mat-dialog-title class="title">{{title}}</h2>

<mat-dialog-content>
  {{message}}
</mat-dialog-content>

<mat-dialog-actions align="center">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="warn" (click)="onConfirm()">{{buttonText}}</button>
</mat-dialog-actions>
