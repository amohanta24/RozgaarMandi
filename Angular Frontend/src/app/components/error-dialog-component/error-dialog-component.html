
<div clas="dialog-box">
<h2 mat-dialog-title class="error-dialog-title">
  ⚠️ Exception Occurred
</h2>

<mat-dialog-content class="error-dialog-content mat-typography">
  {{ msg }}
</mat-dialog-content>

<mat-dialog-actions align="end" class="error-dialog-actions">
  <button mat-raised-button color="warn" (click)="close()">Close</button>
</mat-dialog-actions>
</div>
