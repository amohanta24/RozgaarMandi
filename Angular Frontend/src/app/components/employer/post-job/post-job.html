<div class="postJobMainDiv">
  <mat-card class="post-job-card">
    <mat-card-header>
      <mat-card-title>Post a New Job</mat-card-title>
    </mat-card-header>

    <form [formGroup]="postJobForm" (ngSubmit)="onSubmit($event)" class="post-job-form">
      <mat-card-content>

        <mat-form-field appearance="fill">
          <mat-label>Enter Job Title</mat-label>
          <input matInput mat formControlName="jobTitle" placeholder="Job Title">
          <mat-icon matSuffix>work</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Job Duration</mat-label>
          <input matInput formControlName="duration" placeholder="Job Duration">
          <mat-icon matSuffix>schedule</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Pay</mat-label>
          <input matInput type ="number" formControlName="pay" placeholder="Pay">
          <mat-icon matSuffix>payments</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Location</mat-label>
          <input matInput formControlName="location" placeholder="Location">
          <mat-icon matSuffix>location_on</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="fill">
          <mat-label>Job Description</mat-label>
          <textarea matInput formControlName="jobDescription" placeholder="Job Description"></textarea>
          <mat-icon matSuffix>description</mat-icon>
        </mat-form-field>

      </mat-card-content>

      <mat-card-actions align="start">
        <button class="btn btn-primary col-6 mx-auto" type="submit" [disabled]="postJobForm.invalid">
          Post
        </button>
       
      </mat-card-actions>
    </form>
  </mat-card>

</div>
