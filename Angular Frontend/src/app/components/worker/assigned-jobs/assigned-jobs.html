<div class="container">

    @for (job of joblist; track job.jobId) {
        <mat-card class="example-card" appearance="outlined">
            <mat-card-header>
              <mat-card-title>{{job.jobTitle}}</mat-card-title>
            </mat-card-header>
            <mat-card-content>
              <p>{{job.jobDescription }}</p>
            </mat-card-content>
            <mat-card-footer class="example-card-footer">
              <mat-chip-set aria-label="Chihuahua traits">
                <mat-chip>{{ job.duration }}</mat-chip>
                <mat-chip>₹{{job.pay}}</mat-chip>
                <mat-chip>{{ job.location }}</mat-chip>
              </mat-chip-set>
              <div class="btn-group dropright">
                <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                 {{job.status.replace('_', ' ').toLowerCase() | titlecase}}
                </button>
                <div class="dropdown-menu">
                  @for (status of jobStatus; track status) {
                    <button class="dropdown-item"
                            (click)="job.status = status; onStatusChange(job)">
                      {{status.replace('_', ' ').toLowerCase() | titlecase}}
                    </button>
                  }
                </div>
              </div>
            
            </mat-card-footer>
          </mat-card>
}
</div>
