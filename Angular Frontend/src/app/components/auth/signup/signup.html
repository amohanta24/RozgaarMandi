<div class="signup-box">

    <div class="header">
    <div class="logo-container">
      <img class="logo" src="logo.png" alt="Rozgaarmandi Logo">
    </div>
    </div>

    <div class="input-box">

      <!-- ✅ Form starts here -->
<form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        
    <div class="first-input-grid" >  
        <!-- Basic user fields -->
        <div class="form-group">
          <input formControlName="username" type="text" placeholder="Username">
        </div>
  
        <div class="form-group">
          <input formControlName="email" type="email" placeholder="Email">
        </div>
  
        <div class="form-group">
          <input formControlName="phoneNumber" type="number" placeholder="Phone Number">
        </div>
  
        <div class="form-group">
          <input formControlName="password" type="password" placeholder="Password">
        </div>
    </div>
 
    <div class="role-selection-grid">
        <!-- Role select -->
        <label for="role"> Choose your Role </label>
        <div class="form-group">   
          <select id="role" formControlName="selectedRole">
            <option value="">--SELECT--</option>
            @for (role of roles; track role) {
              <option [value]="role">{{ role }}</option>
            }
          </select>
        </div>
    </div>
  
        <!-- Worker-specific fields -->
        @if(signUpForm.get("selectedRole")?.value.includes('WORKER')) {

        <div class="worker-field-grid" >

          <div class="form-group">
            <input formControlName="workerFirstName" type="text" placeholder="First Name">
          </div>
          <div class="form-group">
            <input formControlName="workerLastName" type="text" placeholder="Last Name">
          </div>

        </div>
        <div class="worker-skill-grid">
        
          <div class="form-group">
            <textarea formControlName="skills" type="text" placeholder="Enter Your Skills"></textarea>
          </div>

        </div>
        
        }
        
        
        <!-- Employer-specific fields -->
        @if(signUpForm.get("selectedRole")?.value.includes('EMPLOYER')) {

        <div class="employerType-select-grid">
            <label for="employerType"> Type of Employer </label>

          <div class="form-group">
            <select id="employerType" formControlName="selectedEmployerType">
              <option value="">--SELECT--</option>
              @for (empType of employerTypes; track empType) {
                <option [value]="empType">{{ empType }}</option>
              }
            </select>
          </div>

        </div>


        
          <!-- Business type -->
          @if(signUpForm.get("selectedEmployerType")?.value.includes('BUSINESS')) {

            <div class="Busines-field-grid">
            
            <div class="form-group"><input formControlName="businessName" type="text" placeholder="Business Name"></div>
            <div class="form-group"><input formControlName="contactPersonName" type="text" placeholder="Contact Person Name"></div>
            <div class="form-group"><input formControlName="contactPersonNumber" type="number" placeholder="Contact Person Number"></div>
            <div class="form-group"><input formControlName="gstNumber" type="text" placeholder="GST Number"></div>

            </div>

            <div class="Busines-desc-grid">

            <div class="form-group"><textarea formControlName="businessDescription" type="text" placeholder="Business Description"></textarea></div>

            </div>
          }
  
          <!-- Individual employer -->
          @if(signUpForm.get("selectedEmployerType")?.value.includes('INDIVIDUAL')) {

        <div class="employer-individual-grid">

            <div class="form-group"><input formControlName="employerFirstName" type="text" placeholder="First Name"></div>
            <div class="form-group"><input formControlName="employerLastName" type="text" placeholder="Last Name"></div>
        </div> 
          }
        }

        <div class="footer">

        <div class="form-group">
          <button type="submit" class="signup-btn" [disabled]="signUpForm.invalid">
            Sign Up
          </button>
        </div>
        </div>
  
      </form>
      <!-- ✅ Form properly closed here -->

    </div>
  
</div>
